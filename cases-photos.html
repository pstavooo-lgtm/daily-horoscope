<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حالات وصور 🖼️</title>
  <style>
    :root {
      --bg-color: #0d5c48;
      --header-bg: #1e63b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: tahoma, arial, sans-serif; }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      background-color: var(--bg-color);
      padding: 12px;
    }

    .navbar {
      background-color: var(--header-bg);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 14px;
      background: rgba(255,255,255,0.2);
      padding: 5px 10px;
      border-radius: 5px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .card p {
      color: #333;
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="navbar">
      <span>حالات وصور 🖼️</span>
      <a href="index.html" class="back-btn">➔ الرئيسية</a>
    </div>

    <!-- محتوى حالات وصور -->
    <div class="card">
      <p>أهلاً بك في قسم الحالات والصور! هنا يمكنك عرض وتحميل أجمل الحالات والعبارات.</p>
    </div>

  </div>

</body>
</html>
