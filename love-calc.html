<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقياس الحب 💖</title>
  <style>
    body { 
      background-color: #0d5c48; 
      font-family: tahoma, sans-serif; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 10px; 
    }
    .container { 
      width: 100%; 
      max-width: 450px; 
      background: white; 
      margin-top: 15px; 
      padding: 20px; 
      border-radius: 12px; 
      height: fit-content; 
      text-align: center; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
    }
    .back-btn { 
      display: inline-block; 
      background: #1e63b8; 
      color: white; 
      padding: 8px 18px; 
      border-radius: 20px; 
      text-decoration: none; 
      font-weight: bold; 
      margin-bottom: 15px; 
      float: right; 
    }
    .input-group { margin: 15px 0; text-align: right; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; margin-top: 5px; box-sizing: border-box; }
    button { background: #d81b60; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 18px; width: 100%; padding: 12px; border-radius: 8px; }
    .result { margin-top: 20px; padding: 15px; background: #fff0f5; border-radius: 8px; border: 1px solid #f8bbd0; display: none; }
    .percentage { font-size: 32px; color: #d81b60; font-weight: bold; margin: 10px 0; }
    .message { font-size: 16px; color: #333; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">➔ العودة للرئيسية</a>
    <h2 style="clear: both; padding-top: 10px; color: #d81b60;">حاسبة ومقياس الحب ❤️</h2>
    
    <div class="input-group">
      <label>اسمك:</label>
      <input type="text" id="name1" placeholder="أدخل اسمك هنا">
    </div>
    
    <div class="input-group">
      <label>اسم الشريك:</label>
      <input type="text" id="name2" placeholder="أدخل اسم الشريك هنا">
    </div>

    <button onclick="calculateLove()">احسب نسبة الحب ✨</button>
    
    <div id="result-box" class="result">
      <div class="message" id="love-names"></div>
      <div class="percentage" id="love-percent">0%</div>
      <div class="message" id="love-msg"></div>
    </div>
  </div>

  <script>
    function calculateLove() {
      const n1 = document.getElementById('name1').value.trim();
      const n2 = document.getElementById('name2').value.trim();

      if(!n1 || !n2) {
        alert("الرجاء كتابة الأسماء أولاً");
        return;
      }

      // خوارزمية حساب نسبة التوافق بناء على أحرف الأسماء
      let combinedStr = (n1 + n2).toLowerCase();
      let sum = 0;
      for (let i = 0; i < combinedStr.length; i++) {
        sum += combinedStr.charCodeAt(i);
      }
      
      let percentage = (sum % 41) + 60; // نسبة تتراوح بين 60% و 100%

      let msg = "";
      if(percentage >= 90) msg = "علاقة مثالية وتوافق روحي روحاني ممتاز! 💕";
      else if(percentage >= 80) msg = "نسبة حب عالية جداً وتفاهم رائع بين الطرفين 🌟";
      else if(percentage >= 70) msg = "علاقة طيبة ومبنية على المودة والاحترام 🌸";
      else msg = "علاقة تحتاج بعض التواصل والاهتمام لتزدهر أكثر ✨";

      document.getElementById('love-names').innerText = n1 + "  ❤️  " + n2;
      document.getElementById('love-percent').innerText = percentage + "%";
      document.getElementById('love-msg').innerText = msg;
      document.getElementById('result-box').style.display = "block";
    }
  </script>
</body>
</html>
